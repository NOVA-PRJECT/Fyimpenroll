<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#082042">
    <meta name="robots" content="noindex">
    <title>Reconnect · FYIMP Portal</title>
    <link rel="icon" href="/pwa/icon-192.png">
    <link rel="stylesheet" href="/pwa/offline.css">
    <script src="/pwa/offline.js" defer></script>

  <body>
    <main>
      <div class="identity"><img src="/pwa/icon-192.png" alt="Kannur University" width="64" height="64"><span>FYIMP PORTAL<small>Kannur University</small></span></div>
      <div class="connection-icon" aria-hidden="true"><svg viewBox="0 0 48 48" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M7 17a27 27 0 0 1 34 0M13 24a18 18 0 0 1 22 0M20 31a7 7 0 0 1 8 0M8 7l32 34"/><circle cx="24" cy="38" r="1"/></svg></div>
      <p class="eyebrow">LET’S GET YOU RECONNECTED</p>
      <h1>Your campus will<br>be right here.</h1>
      <p class="description">We couldn’t reach the portal. Check your Wi-Fi or mobile data, then try again to continue.</p>
      <button id="retry" type="button">Try again <span aria-hidden="true">↗</span></button>
      <a href="/">Return to portal</a>
      <p id="connection-status" role="status" aria-live="polite">Sign-in, attendance and other academic records need an internet connection.</p>
    </main>
