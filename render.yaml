services:
  - type: web
    name: fyimp-backend
    runtime: node
    rootDir: .
    plan: free
    buildCommand: pip install -r requirements.txt && npm ci --workspace=backend --include-workspace-root --include=dev && npm run build:backend && npm prune --omit=dev --workspace=backend --include-workspace-root
    startCommand: npm run start:prod --workspace=backend
    autoDeploy: true
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: TRUST_PROXY_HOPS
        value: 1
