name: Production checks
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true
jobs:
  database-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: review-test-only
          POSTGRES_DB: fyimp_review_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run test:postgres
        env:
          FYIMP_TEST_DATABASE_ISOLATED: '1'
          FYIMP_TEST_DATABASE_URL: postgresql://postgres:review-test-only@localhost:5432/fyimp_review_test
      - run: node scripts/benchmark-review-locks.cjs
        env:
          FYIMP_TEST_DATABASE_ISOLATED: '1'
          FYIMP_TEST_DATABASE_URL: postgresql://postgres:review-test-only@localhost:5432/fyimp_review_test
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-lock-benchmark
          path: scratch/review-lock-benchmark.json
  browser-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: python -c "from ortools.sat.python import cp_model"
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
      - run: node scripts/build-review-release.cjs --check
      - run: node scripts/build-review-prerequisites.cjs --check
      - run: npm run test:regression
      - run: npm run typecheck --workspace=mobile
      - run: npm run build --workspace=mobile
        env:
          EXPO_PUBLIC_API_BASE_URL: https://backend.example.test
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
          EXPO_PUBLIC_PORTAL_URL: https://fyimpenroll.vercel.app
